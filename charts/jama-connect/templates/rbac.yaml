{{- if .Values.rbac.create }}
{{- /*
Minimal namespaced RBAC. Jama components (notably hazelcast/elasticsearch
discovery) may use the Kubernetes API to discover peer pods. Confirm the exact
permissions the rendered KOTS manifests request and tighten as needed.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "jama.fullname" . }}
  namespace: {{ include "jama.namespace" . }}
  labels:
    {{- include "jama.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "jama.fullname" . }}
  namespace: {{ include "jama.namespace" . }}
  labels:
    {{- include "jama.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "jama.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "jama.serviceAccountName" . }}
    namespace: {{ include "jama.namespace" . }}
{{- end }}
