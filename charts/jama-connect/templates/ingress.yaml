{{- if and .Values.ingress.enabled (eq .Values.ingress.type "ingress") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jama.fullname" . }}
  namespace: {{ include "jama.namespace" . }}
  labels:
    {{- include "jama.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.fqdn | quote }}
        {{- range .Values.ingress.extraHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.fqdn | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ .Values.ingress.backendService }}
                port:
                  number: {{ .Values.ingress.backendPort }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ $.Values.ingress.backendService }}
                port:
                  number: {{ $.Values.ingress.backendPort }}
    {{- end }}
{{- end }}
