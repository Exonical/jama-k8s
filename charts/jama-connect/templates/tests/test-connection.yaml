apiVersion: v1
kind: Pod
metadata:
  name: {{ include "jama.fullname" . }}-test-connection
  namespace: {{ include "jama.namespace" . }}
  labels:
    {{- include "jama.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["curl"]
      args:
        - "--silent"
        - "--show-error"
        - "--fail"
        - "http://{{ .Values.ingress.backendService }}:{{ .Values.ingress.backendPort }}/"
