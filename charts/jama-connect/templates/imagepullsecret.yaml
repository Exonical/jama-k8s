{{- if .Values.imagePullSecret.create }}
{{- /*
Convenience dockerconfigjson secret. Prefer referencing a pre-existing secret
via global.imagePullSecrets in GitOps. Never commit real credentials: supply
username/password at install time (--set) or via a sealed/external secret.
*/ -}}
{{- $reg := .Values.imagePullSecret.registry }}
{{- $user := .Values.imagePullSecret.username }}
{{- $pass := .Values.imagePullSecret.password }}
{{- $email := .Values.imagePullSecret.email }}
{{- $auth := printf "%s:%s" $user $pass | b64enc }}
{{- $dockerconfig := dict "auths" (dict $reg (dict "username" $user "password" $pass "email" $email "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ include "jama.namespace" . }}
  labels:
    {{- include "jama.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerconfig | toJson | b64enc }}
{{- end }}
